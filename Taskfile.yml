version: '3'

tasks:
  install:
    desc: "Install dev dependencies via Poetry (source of truth). Pip alternative: pip install -r requirements.txt"
    cmds:
      - poetry install

  export-reqs:
    desc: Regenerate requirements.txt from pyproject (the artifact Vercel/Docker install from)
    cmds:
      - poetry export --without-hashes -f requirements.txt -o requirements.txt

  setup-supabase:
    desc: Create all tables in Supabase Postgres (lost_items + users/lost_reports/matches/notifications)
    cmds:
      - python3 scripts/setup_db.py
      
  init-lostitem:
    desc: Initialize lost item table from pre-crawled csv file
    cmds:
      - python3 scripts/seed_from_csv.py
      
  crawl-lib:
    desc: Run the Python BeautifulSoup scraper locally and push to Supabase
    cmds:
      - python3 scripts/scrapers/supa_crawl_lib.py

  match-lostitems:
    desc: Embed newly scraped lost_items and match them against existing reports
    cmds:
      - python3 scripts/match_lost_items.py

  cleanup:
    desc: Stop local server on the configured frontend port
    cmds:
    - |
      PORT="{{default "8000" .PORT}}"
      pids=$(lsof -t -nP -iTCP:"$PORT" -sTCP:LISTEN 2>/dev/null | tr '\n' ' ')
      if [ -n "$pids" ]; then
        echo "Stopping processes on port: $PORT"
        /bin/kill $pids
      else
        echo "No listening process found on port: $PORT"
      fi

  serve:
    desc: Run the Flask application
    cmds:
    - |
      PORT="{{default "8000" .PORT}}"
      HOST="{{default "127.0.0.1" .HOST}}"
      echo "Serving NTU Lost ETL Hub at http://$HOST:$PORT"
      python3 app.py

  up:
    desc: Cleanup the frontend port then start the local server
    cmds:
    - task: cleanup
    - task: serve

  down:
    desc: Stop the local frontend server
    cmds:
    - task: cleanup

  open:
    desc: Open the frontend in the browser
    cmds:
    - |
      PORT="{{default "8000" .PORT}}"
      HOST="{{default "127.0.0.1" .HOST}}"
      open "http://$HOST:$PORT"

  test:
    desc: Run unit and integration tests
    cmds:
      - poetry run pytest

  test-unit:
    desc: Run unit tests only
    cmds:
      - poetry run pytest -m unit

  test-integration:
    desc: Run Flask integration tests only
    cmds:
      - poetry run pytest -m integration

  test-e2e:
    desc: Run headless Chrome end-to-end tests
    cmds:
      - poetry run pytest -o addopts="" -m ui

  test-all:
    desc: Run unit, integration, and end-to-end tests
    cmds:
      - poetry run pytest -o addopts=""
